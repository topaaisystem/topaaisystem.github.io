<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매일 명언 카드</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d22;--sub:#6b665a;--line:#ddd6c6;--gold:#a8782a;--btn:#8a5f1c}
@media (prefers-color-scheme:dark){:root{--bg:#14151a;--fg:#ece8dd;--sub:#a8a498;--line:#33363f;--gold:#e2bd78;--btn:#e2bd78}}
*{box-sizing:border-box}
[hidden]{display:none !important}   /* display 지정이 hidden 속성을 덮어쓰지 않게 */
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--sub);font-size:14px}
img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
p#state{color:var(--sub)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 8px}
button,a.btn{font:inherit;font-size:16px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--btn);
  background:var(--btn);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
@media (prefers-color-scheme:dark){button,a.btn{color:#14151a}}
button.alt,a.alt{background:transparent;color:var(--btn)}
button:focus-visible,a.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#hint{color:var(--sub);font-size:14px}
footer{margin-top:20px;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>매일 명언 카드</h1>
  <p class="sub" id="date"></p>
  <p id="state" role="status">카드를 불러오는 중…</p>
  <img id="card" alt="명언 카드" hidden>
  <div class="actions" id="actions" hidden>
    <a class="btn" id="dl" href="#" download>이미지 다운로드</a>
    <button type="button" id="share" class="alt" hidden>공유 / 사진 앱에 저장</button>
    <a class="btn alt" id="open" href="#" target="_blank" rel="noopener">이미지 열기</a>
  </div>
  <p id="hint">다운로드가 안 되면 &lsquo;이미지 열기&rsquo;를 누르거나 위 이미지를 길게 눌러 &lsquo;이미지 저장&rsquo;을 선택하세요. 카카오톡 안에서 안 되면 오른쪽 위 메뉴의 &lsquo;다른 브라우저로 열기&rsquo; 후 저장하면 됩니다.</p>
  <footer>매일 아침 08:30(한국시간)에 새 카드가 만들어집니다. 명언 출처는 위키인용집, 초상·배경은 위키미디어 커먼스(퍼블릭 도메인)입니다. 카드는 명언, 한국어 번역, 명언자, 초상, 배경이 담긴 한 장의 이미지입니다.</footer>
</main>
<script>
// 같은 파일을 프로젝트 저장소와 사용자 사이트 저장소 어디에 두어도 동작하도록 카드 주소를 고정
const BASE = 'https://topaaisystem.github.io/daily-quote-cards/cards/';
const fmt = new Intl.DateTimeFormat('en-CA', {timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'});
const kstToday = () => fmt.format(new Date());
const daysAgo = n => fmt.format(new Date(Date.now() - n * 86400000));
const $ = id => document.getElementById(id);
const card = $('card'), state = $('state'), hint = $('hint');
const asked = new URLSearchParams(location.search).get('d');            // 카톡 카드의 링크: ?d=YYYY-MM-DD
let current = null, tries = 0;

function shown(day) {
  current = {day, url: BASE + day + '.jpg'};
  card.hidden = $('actions').hidden = false;
  state.hidden = true;
  $('open').href = current.url;
  $('dl').href = current.url;                                         // blob이 아닌 .jpg 주소를 직접 연결(같은 사이트라 download 속성이 적용됨)
  $('dl').download = 'quote-card-' + day + '.jpg';
  $('date').textContent = (day === kstToday() ? '오늘의 카드 · ' : '카드 · ') + day;
  if (navigator.canShare && navigator.canShare({files: [new File([], 'x.jpg', {type: 'image/jpeg'})]})) $('share').hidden = false;
}
function load() {
  const first = tries === 0 && /^\d{4}-\d{2}-\d{2}$/.test(asked || '') ? asked : null;   // 요청한 날짜를 먼저 시도
  if (tries > 14) { state.textContent = '표시할 카드를 찾지 못했습니다. 잠시 후 다시 열어 주세요.'; return; }
  const day = first || daysAgo(first ? 0 : (asked ? tries - 1 : tries));
  tries++;
  card.onload = () => shown(day);
  card.onerror = load;                                                // 없으면 오늘, 어제, 그제… 순서로 시도
  card.src = BASE + day + '.jpg';
}
async function blobOfCard() {
  const r = await fetch(current.url, {mode: 'cors', cache: 'no-store'});
  if (!r.ok) throw new Error('fetch');
  return r.blob();
}
$('share').onclick = async () => {
  try {
    const file = new File([await blobOfCard()], 'quote-card-' + current.day + '.jpg', {type: 'image/jpeg'});
    await navigator.share({files: [file], title: '매일 명언 카드'});
  } catch (e) { /* 공유를 취소했거나 지원하지 않으면 아래 안내 문구를 따르면 됨 */ }
};
load();
</script>
</body>
</html>
